[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kirag"
version = "2.0.3"
description = "OLMOCR PDF-to-Markdown extraction & medicolegal RAG analysis suite"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "qdrant-client>=1.9.0,<1.11.0",
    "sentence-transformers>=3.0.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pypdf>=4.0.0",
    "pypdfium2>=4.0.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
kirag = "cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.15.0",
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["workspace/", "venv/", ".venv/", "__pycache__/", "tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.coverage.run]
omit = ["tests/*", "workspace/*", "conftest.py", "rag_ui.py", "cli.py", "api/*", "ui_adapters.py"]


[tool.coverage.report]
fail_under = 98
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:", "def __repr__"]

[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "kirag"
version = "2.0.3"
description = "OLMOCR PDF-to-Markdown extraction & medicolegal RAG analysis suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "redis>=5.0.0",
    "minio>=7.2.0",
    "qdrant-client>=1.9.0,<1.11.0",
    "sentence-transformers>=3.0.0",
    "transformers>=5.0.0",
    "tiktoken>=0.7.0",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pypdf>=5.2.0",
    "pypdfium2>=4.0.0",
    "numpy>=1.24.0",
    "python-docx>=1.1.0",
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "starlette>=0.37.2",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "huggingface-hub>=0.23.0",
    "psutil>=5.9.0",
    "torch==2.13.0",
    "olmocr>=0.4.27",
]

[project.scripts]
kirag = "cli:main"

[project.optional-dependencies]
dev = [
    "bandit>=1.9.4",
    "build>=1.2.2",
    "coverage>=7.15.0",
    "detect-secrets>=1.5.0",
    "httpx2>=2.7.0",
    "pip-audit>=2.10.1",
    "ruff>=0.5.0",
    "pytest>=9.0.3",
    "PyYAML>=6.0.2",
    "uv>=0.11.15",
    "wheel>=0.45.0",
]

[tool.setuptools]
include-package-data = false
packages = ["api", "api.routes", "assets", "rag"]
py-modules = [
    "app",
    "app_handlers",
    "audit_log",
    "cleanup_manager",
    "cli",
    "docker_manager",
    "download_models",
    "embedding_pipeline_ui",
    "gradio_security",
    "html_utils",
    "indexing_service",
    "path_security",
    "pdf_manager",
    "pipeline_manager",
    "process_state",
    "rag_export",
    "rag_infra_manager",
    "rag_ui",
    "rag_ui_dashboard",
    "rag_ui_handlers",
    "rag_ui_state",
    "secrets_config",
    "settings_manager",
    "system_diagnostics",
    "ui_adapters",
    "ui_theme",
]

[tool.setuptools.package-data]
assets = ["*.css", "*.js"]

[tool.setuptools.data-files]
"share/kirag" = ["docker-compose.rag.yml"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["workspace/", "venv/", ".venv/", "__pycache__/", "tests/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "B904", "F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F403", "F405"]

[tool.ruff.lint.isort]
known-first-party = ["rag"]

[tool.coverage.run]
branch = true
source = [
    "api",
    "rag",
    "app",
    "app_handlers",
    "audit_log",
    "cleanup_manager",
    "cli",
    "docker_manager",
    "download_models",
    "embedding_pipeline_ui",
    "gradio_security",
    "html_utils",
    "indexing_service",
    "path_security",
    "pdf_manager",
    "pipeline_manager",
    "process_state",
    "rag_export",
    "rag_infra_manager",
    "rag_ui",
    "rag_ui_dashboard",
    "rag_ui_handlers",
    "rag_ui_state",
    "secrets_config",
    "settings_manager",
    "system_diagnostics",
    "ui_adapters",
    "ui_theme",
]
omit = ["tests/*", "workspace/*", "conftest.py"]


[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "if __name__ == .__main__.:", "def __repr__"]

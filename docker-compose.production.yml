name: kirag

# Production overlay. Use with docker-compose.rag.yml so persistent backing
# services and vLLM are started, health-gated, and supervised as one stack.
services:
  postgres:
    stop_grace_period: 60s
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    stop_grace_period: 60s
    logging: *rotated-logs

  minio:
    stop_grace_period: 60s
    logging: *rotated-logs

  qdrant:
    stop_grace_period: 60s
    logging: *rotated-logs

  vllm:
    image: ${OLMOCR_VLLM_IMAGE:?Set OLMOCR_VLLM_IMAGE to a digest-pinned image}
    container_name: kirag_vllm
    labels:
      com.kirag.managed: "true"
      com.kirag.component: vllm-slot
      com.kirag.role: ${KIRAG_VLLM_ROLE:-inactive}
    restart: unless-stopped
    init: true
    stop_grace_period: ${KIRAG_VLLM_STOP_TIMEOUT:-120s}
    gpus: all
    shm_size: ${KIRAG_VLLM_SHM_SIZE:-8gb}
    environment:
      NVIDIA_DISABLE_REQUIRE: "1"
      HF_HOME: /root/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TORCH_AOT_AUTOGRAD_CACHE: "0"
      KIRAG_VLLM_ROLE: ${KIRAG_VLLM_ROLE:-}
      KIRAG_VLLM_MODEL: ${KIRAG_VLLM_MODEL:-}
      KIRAG_VLLM_MODEL_REVISION: ${KIRAG_VLLM_MODEL_REVISION:-}
      KIRAG_VLLM_GPU_MEMORY_UTILIZATION: ${KIRAG_VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      KIRAG_VLLM_MAX_MODEL_LEN: ${KIRAG_VLLM_MAX_MODEL_LEN:-}
      KIRAG_VLLM_MAX_BATCHED_TOKENS: ${KIRAG_VLLM_MAX_BATCHED_TOKENS:-}
      KIRAG_VLLM_TENSOR_PARALLEL_SIZE: ${KIRAG_VLLM_TENSOR_PARALLEL_SIZE:-1}
    ports:
      - "127.0.0.1:${KIRAG_VLLM_HOST_PORT:-8002}:8000"
    volumes:
      - ${KIRAG_HF_HOME:-./workspace/huggingface}:/root/.cache/huggingface:ro
      - ./scripts/vllm-entrypoint.sh:/opt/kirag/vllm-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/opt/kirag/vllm-entrypoint.sh"]
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=5)"
      interval: 15s
      timeout: 6s
      start_period: ${KIRAG_VLLM_HEALTH_START_PERIOD:-30m}
      retries: 5
    logging: *rotated-logs

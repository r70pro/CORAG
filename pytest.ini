[pytest]
norecursedirs = workspace .git .pytest_cache
markers =
    integration: container-backed tests requiring disposable PostgreSQL, Redis, MinIO, and Qdrant
    phase0_regression: Phase 0 security, correctness, and provenance regression contract
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
    ignore::Warning
    ignore::ResourceWarning

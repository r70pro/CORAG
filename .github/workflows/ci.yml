name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  python-unit:
    name: Python unit tests and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-cpu.lock
            requirements-dev.lock

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils

      - name: Install locked application and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-cpu.lock
          python -m pip install -r requirements-dev.lock

      - name: Check Python formatting and lint
        run: |
          ruff check .
          ruff format --check .

      - name: Run fast tests with branch coverage
        env:
          TESTING: "true"
        run: |
          coverage erase
          coverage run -m pytest -m "not integration" tests
          coverage report
          coverage report --fail-under=100 path_security.py api/auth.py
          coverage xml -o coverage.xml

  python-integration:
    name: Disposable container integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_PROJECT_NAME: kirag-ci-${{ github.run_id }}-${{ github.run_attempt }}
      KIRAG_RUN_INTEGRATION: "1"
      OLMOCR_PG_HOST: localhost
      OLMOCR_PG_DB: olmocr_rag
      OLMOCR_PG_USER: olmocr
      OLMOCR_PG_PASS: integration-postgres-password
      OLMOCR_REDIS_HOST: localhost
      OLMOCR_REDIS_DB: "0"
      OLMOCR_MINIO_ACCESS_KEY: integration-minio-user
      OLMOCR_MINIO_SECRET_KEY: integration-minio-password # pragma: allowlist secret
      OLMOCR_MINIO_SECURE: "false"
      OLMOCR_QDRANT_HOST: localhost

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-cpu.lock
            requirements-dev.lock

      - name: Install locked test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-cpu.lock
          python -m pip install -r requirements-dev.lock

      - name: Validate disposable Compose configuration
        run: docker compose -f docker-compose.integration.yml config --quiet

      - name: Run container-backed tests and remove volumes
        run: |
          trap 'docker compose -f docker-compose.integration.yml down --volumes --remove-orphans' EXIT
          docker compose -f docker-compose.integration.yml up --detach --wait
          integration_pg_address="$(docker compose -f docker-compose.integration.yml port postgres 5432)"
          integration_redis_address="$(docker compose -f docker-compose.integration.yml port redis 6379)"
          integration_minio_address="$(docker compose -f docker-compose.integration.yml port minio 9000)"
          integration_qdrant_address="$(docker compose -f docker-compose.integration.yml port qdrant 6333)"
          export OLMOCR_PG_PORT="${integration_pg_address##*:}"
          export OLMOCR_REDIS_PORT="${integration_redis_address##*:}"
          export OLMOCR_MINIO_ENDPOINT="localhost:${integration_minio_address##*:}"
          export OLMOCR_QDRANT_PORT="${integration_qdrant_address##*:}"
          pytest -m integration tests/test_integration_rag.py

  security:
    name: Production dependency and source security
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install security tools
        run: python -m pip install -r requirements-dev.lock

      - name: Audit Python production locks
        run: |
          # The +cpu wheel has the same Torch source version audited by the
          # canonical CUDA entry in the second command.
          pip-audit -r requirements-cpu.lock --disable-pip --progress-spinner off --extra-index-url https://download.pytorch.org/whl/cpu
          pip-audit -r requirements-cuda.lock --disable-pip --progress-spinner off

      - name: Run high-severity static security analysis
        run: |
          bandit -r api rag ./*.py -lll -q

      - name: Reject secrets not in the reviewed baseline
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline

  package:
    name: Build and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-cpu.lock

      - name: Install build frontend
        run: python -m pip install build==1.3.0

      - name: Build distributions and verify a clean wheel install
        run: scripts/verify-distribution.sh

  frontend:
    name: Frontend tests, production build, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build

  container-config:
    name: Container configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate developer Compose configuration
        run: docker compose -f docker-compose.rag.yml config --quiet

      - name: Validate disposable integration Compose configuration
        run: docker compose -f docker-compose.integration.yml config --quiet

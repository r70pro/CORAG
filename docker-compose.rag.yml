
name: kirag

services:
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: olmocr_postgres
    labels:
      com.kirag.managed: "true"
      com.kirag.component: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: olmocr_rag
      POSTGRES_USER: olmocr
      # Resolve from host environment (.env) with a safe placeholder default.
      POSTGRES_PASSWORD: ${OLMOCR_PG_PASS:-change_me_in_production}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./workspace/pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olmocr -d olmocr_rag"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 60s
    logging: &rotated-logs
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    container_name: olmocr_redis
    labels:
      com.kirag.managed: "true"
      com.kirag.component: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./workspace/redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 60s
    logging: *rotated-logs

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: olmocr_minio
    labels:
      com.kirag.managed: "true"
      com.kirag.component: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${OLMOCR_MINIO_ACCESS_KEY:-minio_access_5c6d3284f18b}
      MINIO_ROOT_PASSWORD: ${OLMOCR_MINIO_SECRET_KEY:-change_me_minio_secret}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./workspace/minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 60s
    logging: *rotated-logs

  qdrant:
    image: qdrant/qdrant@sha256:6a34a799bed69c7c25c4e87ab04092005e4579062a9bf0e82a75d0b21f030006
    container_name: olmocr_qdrant
    labels:
      com.kirag.managed: "true"
      com.kirag.component: qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./workspace/qdrant_storage:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
    stop_grace_period: 60s
    logging: *rotated-logs

networks:
  default:
    name: kirag_rag_network
    driver: bridge
